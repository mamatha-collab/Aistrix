name: CI

# Lint, unit tests and build for the frontend; the backend check suite.
# Tests never reach real services: provider/Stripe/email keys are blanked by
# aistrix-backend/tests/checks/_harness.py and Supabase is faked.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aistrix-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: aistrix-backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -v

  frontend:
    name: Frontend lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: aistrix-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: aistrix-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
