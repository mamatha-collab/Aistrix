[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aistrix"
version = "0.1.0"
description = "Aistrix SDK and CLI — run AI apps from your terminal"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
aistrix = "aistrix.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aistrix*"]
