[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aistrix"
version = "0.3.0"
description = "Aistrix SDK and CLI — build, release and run AI apps and pipelines"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
aistrix = "aistrix.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aistrix*"]
